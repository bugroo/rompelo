name: assure
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Battery (every gate seen red and green)
        run: |
          mkdir -p "$HOME/assure"
          cp -R . "$HOME/assure/"
          git config --global user.email ci@example.com
          git config --global user.name ci
          bash "$HOME/assure/tests/assure-stop-test.sh"
      - name: Tri-state check sees its own positive control
        run: |
          bash "$HOME/assure/tests/sin-var-pegada.sh" "$HOME/assure"; test $? -eq 0
          D=$(mktemp -d); printf 'echo «$X»\n' > "$D/malo.sh"
          bash "$HOME/assure/tests/sin-var-pegada.sh" "$D"; test $? -eq 1
          bash "$HOME/assure/tests/sin-var-pegada.sh" "$D/nada"; test $? -eq 2
      - name: Corpus table regenerates from the incidents
        run: |
          python3 -m pip install --quiet pyyaml
          python3 "$HOME/assure/bin/assure-corpus.py"
