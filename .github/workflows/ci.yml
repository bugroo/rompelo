name: rompelo
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, fijado por SHA el 07-09-2026
        with: { fetch-depth: 0 }   # la base del contrato tiene que existir: una base ausente es ERROR, no HEAD
      - name: Battery (every gate seen red and green)
        run: |
          mkdir -p "$HOME/rompelo"
          cp -R . "$HOME/rompelo/"
          git config --global user.email ci@example.com
          git config --global user.name ci
          bash "$HOME/rompelo/tests/rompelo-stop-test.sh"
      - name: Observation layer battery (every trigger seen firing and not firing)
        run: bash "$HOME/rompelo/tests/rompelo-observe-test.sh"
      - name: Test instrument control (assertions reject a dead, missing, garbled or hung hook)
        run: bash "$HOME/rompelo/tests/instrumento-test.sh"
      - name: Portability (HOME with spaces, same folder name twice, alternate ROMPELO_HOME, doctor)
        run: bash "$HOME/rompelo/tests/portabilidad-test.sh"
      - name: Tri-state check sees its own positive control
        # Con `bash -e` un comando que sale con 1 aborta el paso antes del test: se captura el código.
        run: |
          espera() { rc=0; bash "$HOME/rompelo/tests/sin-var-pegada.sh" "$1" || rc=$?; [ "$rc" -eq "$2" ] || { echo "esperaba $2, salió $rc"; exit 1; }; }
          espera "$HOME/rompelo" 0
          D=$(mktemp -d); printf 'echo «$X»\n' > "$D/malo.sh"
          espera "$D" 1
          espera "$D/nada" 2
      - name: Corpus table regenerates from the incidents and matches the committed one
        run: |
          python3 -m pip install --quiet 'pyyaml==6.0.3'   # fijado el 07-09-2026 (última en PyPI ese día)
          python3 bin/rompelo-corpus.py
          git diff --exit-code -- corpus/TABLA.md || { echo "corpus/TABLA.md está desactualizada: regenera y commitea"; exit 1; }
      - name: The gate judges this repo too (verify --ci)
        run: |
          cd "$HOME/rompelo"
          ROMPELO_HOME="$PWD" bin/rompelo verify --ci
